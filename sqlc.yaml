version: "2"
sql:
  - name: "postgres"
    engine: "postgresql"
    schema: "internal/database/postgres/migrations/"
    queries: "internal/database/postgres/queries/"
    gen:
      go:
        package: "pgdb"
        out: "internal/database/postgres/pgdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "updates.asset_mapping"
            go_type:
              import: "xprem/internal/types"
              type: "UpdateAssetMapping"
              pointer: true
          - column: "builds.status"
            go_type:
              import: "xprem/internal/types"
              type: "BuildStatus"
          - column: "bundle_patches.status"
            go_type:
              import: "xprem/internal/types"
              type: "BundlePatchStatus"
          - column: "app_identifiers.platform"
            go_type:
              import: "xprem/internal/types"
              type: "Platform"
          - column: "builds.platform"
            go_type:
              import: "xprem/internal/types"
              type: "Platform"
          - column: "updates.platform"
            go_type:
              import: "xprem/internal/types"
              type: "Platform"
